<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>文字挂机修仙</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e5e7eb;font-family:Arial,"Microsoft YaHei",sans-serif}#app{max-width:1180px;margin:0 auto;padding:16px}h1{margin:0 0 6px;color:#facc15}h2{margin:0 0 10px;color:#93c5fd}.desc{color:#94a3b8;margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#172033;border:1px solid #334155;border-radius:14px;padding:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:8px}.stat b{display:block;color:#fff;font-size:18px}.stat small{color:#94a3b8}.realm{display:inline-block;background:#facc15;color:#111827;border-radius:999px;padding:3px 10px;margin-left:8px;font-size:15px}.save{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:8px 10px;margin:8px 0;color:#86efac}.bar{height:13px;background:#020617;border:1px solid #334155;border-radius:999px;overflow:hidden;margin:6px 0 10px}.bar i{display:block;height:100%;width:0;background:#22c55e}.xp i{background:#3b82f6}.enemy i{background:#ef4444}.cult i{background:#facc15}.alchemy i{background:#14b8a6}button,select{border:0;border-radius:9px;padding:8px 10px;margin:3px;background:#facc15;color:#111827;font-weight:700;cursor:pointer}button.blue{background:#60a5fa}button.green{background:#4ade80}button.red{background:#fb7185}button.purple{background:#c084fc}button:disabled{opacity:.5;cursor:not-allowed}select{width:100%;background:#dbeafe}.row{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:9px;margin:7px 0}.row strong{color:#fff}.row small{display:block;color:#94a3b8}.ok{color:#86efac}.bad{color:#fca5a5}.rare{color:#c4b5fd}.dan{color:#5eead4}.log{height:290px;overflow:auto;background:#020617;border:1px solid #334155;border-radius:10px;padding:9px}.log p{margin:0 0 6px}.tips{font-size:13px;color:#94a3b8}@media(max-width:850px){.grid,.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app">
<h1>文字挂机修仙：功法融合版</h1>
<p class="desc">打怪、炼体、内功、武学、炼丹同时挂机。功法可以从低级一步步融合成高级。</p>
<div><button onclick="saveGame(true)">手动保存</button><button class="red" onclick="resetGame()">重开</button><button class="blue" id="autoBtn" onclick="toggleAuto()">打怪挂机：开</button></div>
<div class="save" id="saveStatus">正在读取存档……</div>
<div class="grid">
<div class="card"><h2>角色 <span class="realm" id="realmText">凡人</span></h2><div class="stats"><div class="stat"><b id="realmStat">凡人</b><small>当前境界</small></div><div class="stat"><b id="nextRealmText">10级</b><small>下次突破</small></div><div class="stat"><b id="levelText">1</b><small>等级</small></div><div class="stat"><b id="goldText">0</b><small>金币</small></div><div class="stat"><b id="herbText">0</b><small>药草</small></div><div class="stat"><b id="powerText">0</b><small>战力</small></div><div class="stat"><b id="atkText">0</b><small>攻击</small></div><div class="stat"><b id="defText">0</b><small>防御</small></div><div class="stat"><b id="hpText">0</b><small>生命</small></div><div class="stat"><b id="alchemyLevelText">1</b><small>炼丹等级</small></div></div><p>生命</p><div class="bar"><i id="hpBar"></i></div><p>经验</p><div class="bar xp"><i id="xpBar"></i></div><button onclick="attackEnemy()">手动攻击</button><button class="green" onclick="useHealPill()">使用回春丹</button><button class="purple" onclick="breakRealm()">突破境界</button><p class="tips" id="breakTip"></p></div>
<div class="card"><h2>当前敌人</h2><h3 id="enemyName">野狼</h3><p id="enemyInfo"></p><div class="bar enemy"><i id="enemyBar"></i></div><p>击杀：<b id="killText">0</b> ｜ 爆装率：<b id="dropText">8%</b> ｜ 装备战力：<b id="equipText">0</b></p></div>
<div class="card"><h2>三系功法挂机</h2><div class="stats"><div class="stat"><b>炼体</b><select id="bodySelect" onchange="setManual('body',this.value)"></select><div class="bar cult"><i id="bodyBar"></i></div><small id="bodyInfo"></small></div><div class="stat"><b>内功</b><select id="innerSelect" onchange="setManual('inner',this.value)"></select><div class="bar cult"><i id="innerBar"></i></div><small id="innerInfo"></small></div><div class="stat"><b>武学</b><select id="martialSelect" onchange="setManual('martial',this.value)"></select><div class="bar cult"><i id="martialBar"></i></div><small id="martialInfo"></small></div><div class="stat"><button onclick="manualCultivate()">手动参悟</button><button onclick="useCultPill('body')">炼体丹</button><button onclick="useCultPill('inner')">聚气丹</button><button onclick="useCultPill('martial')">悟道丹</button></div></div></div>
<div class="card"><h2>炼丹炉</h2><p>回春丹 <b id="pillHeal">0</b> ｜ 炼体丹 <b id="pillBody">0</b> ｜ 聚气丹 <b id="pillInner">0</b> ｜ 悟道丹 <b id="pillMartial">0</b> ｜ 破境丹 <b id="pillBreak">0</b></p><select id="recipeSelect" onchange="setRecipe(this.value)"></select><div class="bar alchemy"><i id="alchemyBar"></i></div><p id="alchemyInfo"></p></div>
<div class="card"><h2>商店</h2><div id="shopBox"></div></div>
<div class="card"><h2>功法融合</h2><div id="fusionBox"></div></div>
<div class="card"><h2>功法库</h2><div id="manualBox"></div></div>
<div class="card"><h2>挂机日志</h2><div class="log" id="logBox"></div></div>
</div>
</div>
<script>
(function(){
const LOCAL_KEY="xianxia_idle_server_v1";
const realms=["凡人","炼气","筑基","金丹","元婴","化神","炼虚","合体","大乘","渡劫","真仙"];
const enemyNames=["野狼","山贼","黑熊","毒蛇","骷髅兵","赤焰虎","幽魂","石甲兽","魔修","深渊妖王"];
const manuals={
"铁布衫":{type:"body",rank:1,hp:10,atk:0,def:1,price:0},"金钟罩":{type:"body",rank:1,hp:14,atk:0,def:2,price:180},"虎魔炼骨功":{type:"body",rank:2,hp:28,atk:1,def:3,price:620},"龙象镇狱体":{type:"body",rank:3,hp:48,atk:2,def:5,price:1300},"九转不灭身":{type:"body",rank:4,hp:90,atk:3,def:8,price:2600},"金刚不坏功":{type:"body",rank:3,hp:70,atk:2,def:8,price:0},"龙象玄黄体":{type:"body",rank:4,hp:115,atk:4,def:12,price:0},"九转金身诀":{type:"body",rank:6,hp:220,atk:8,def:22,price:0},
"养气诀":{type:"inner",rank:1,hp:6,atk:1,def:0,price:0},"紫霞心法":{type:"inner",rank:1,hp:8,atk:1,def:1,price:180},"太玄经":{type:"inner",rank:2,hp:16,atk:3,def:2,price:650},"北冥真气诀":{type:"inner",rank:3,hp:26,atk:5,def:3,price:1350},"混元无极功":{type:"inner",rank:4,hp:46,atk:7,def:5,price:2800},"紫霞真元功":{type:"inner",rank:3,hp:45,atk:6,def:5,price:0},"北冥太玄功":{type:"inner",rank:4,hp:80,atk:10,def:7,price:0},"混元太上经":{type:"inner",rank:6,hp:150,atk:20,def:14,price:0},
"基础拳法":{type:"martial",rank:1,hp:0,atk:3,def:0,price:0},"追风剑法":{type:"martial",rank:1,hp:0,atk:4,def:0,price:180},"降龙掌":{type:"martial",rank:2,hp:8,atk:8,def:1,price:680},"太极剑经":{type:"martial",rank:3,hp:16,atk:11,def:3,price:1400},"万剑归宗":{type:"martial",rank:4,hp:22,atk:18,def:4,price:3000},"风雷拳剑诀":{type:"martial",rank:3,hp:8,atk:14,def:2,price:0},"龙虎太极经":{type:"martial",rank:4,hp:25,atk:20,def:5,price:0},"万法归一剑典":{type:"martial",rank:6,hp:45,atk:38,def:8,price:0}
};
const fusions=[
{target:"金刚不坏功",req:[["铁布衫",3],["金钟罩",3]],gold:500,herb:20},{target:"龙象玄黄体",req:[["虎魔炼骨功",4],["龙象镇狱体",4]],gold:1200,herb:45},{target:"九转金身诀",req:[["金刚不坏功",5],["龙象玄黄体",5],["九转不灭身",3]],gold:5200,herb:150},
{target:"紫霞真元功",req:[["养气诀",3],["紫霞心法",3]],gold:500,herb:20},{target:"北冥太玄功",req:[["太玄经",4],["北冥真气诀",4]],gold:1300,herb:50},{target:"混元太上经",req:[["紫霞真元功",5],["北冥太玄功",5],["混元无极功",3]],gold:5600,herb:160},
{target:"风雷拳剑诀",req:[["基础拳法",3],["追风剑法",3]],gold:500,herb:20},{target:"龙虎太极经",req:[["降龙掌",4],["太极剑经",4]],gold:1350,herb:55},{target:"万法归一剑典",req:[["风雷拳剑诀",5],["龙虎太极经",5],["万剑归宗",3]],gold:6000,herb:170}
];
const recipes={heal:{name:"回春丹",herb:5,gold:8,time:18,desc:"恢复生命"},body:{name:"炼体丹",herb:9,gold:16,time:28,desc:"增加炼体经验"},inner:{name:"聚气丹",herb:9,gold:16,time:28,desc:"增加内功经验"},martial:{name:"悟道丹",herb:10,gold:18,time:30,desc:"增加武学经验"},break:{name:"破境丹",herb:28,gold:80,time:70,desc:"突破增加成功率"}};
let game={level:1,xp:0,gold:0,herb:0,hp:100,baseHp:100,baseAtk:5,baseDef:1,realm:0,kills:0,auto:true,speed:0,equip:0,enemy:null,manual:{},active:{body:"铁布衫",inner:"养气诀",martial:"基础拳法"},pill:{heal:0,body:0,inner:0,martial:0,break:0},alchemy:{recipe:"heal",progress:0,level:1,xp:0},last:Date.now()};
function $(x){return document.getElementById(x)}function now(){return new Date().toLocaleTimeString()}
function status(t){$("saveStatus").textContent=t}
function initManuals(){Object.keys(manuals).forEach(n=>{if(!game.manual[n])game.manual[n]={unlocked:["铁布衫","养气诀","基础拳法"].includes(n),level:1,xp:0}})}
function log(t,c){const p=document.createElement("p");p.className=c||"";p.textContent="["+now()+"] "+t;$("logBox").prepend(p);while($("logBox").children.length>90)$("logBox").lastChild.remove()}
function expNeed(){return Math.floor(45+game.level*game.level*12)}function manualNeed(n){const m=manuals[n],s=game.manual[n];return Math.floor(60*m.rank+s.level*s.level*26*m.rank)}
function bonus(){let hp=0,atk=0,def=0;Object.keys(game.manual).forEach(n=>{const s=game.manual[n],m=manuals[n];if(s&&s.unlocked&&m){const f=s.level*m.rank;hp+=m.hp*f;atk+=m.atk*f;def+=m.def*f}});return{hp:Math.floor(hp),atk:Math.floor(atk),def:Math.floor(def)}}
function maxHp(){return game.baseHp+bonus().hp}function atk(){return game.baseAtk+bonus().atk}function def(){return game.baseDef+bonus().def}function pct(a,b){return Math.max(0,Math.min(100,a/b*100))+"%"}
function nextRealmLevel(){return (game.realm+1)*10}function nextRealmCost(){return 500+game.realm*700}
function newEnemy(){const lv=Math.max(1,game.level+Math.floor(Math.random()*3)-1),tier=Math.min(enemyNames.length-1,Math.floor((game.level-1)/5)),hp=Math.floor(24+lv*18+game.realm*35+Math.random()*lv*5);game.enemy={name:enemyNames[tier],level:lv,hp:hp,maxHp:hp,atk:Math.floor(3+lv*2.2+game.realm*4),gold:Math.floor(8+lv*4+Math.random()*lv*3),xp:Math.floor(12+lv*8+Math.random()*lv*4)}}
function attackEnemy(){if(!game.enemy)newEnemy();let dmg=Math.floor(atk()+game.level*1.8+game.realm*7+Math.random()*atk()*0.55);if(Math.random()<0.08)dmg*=2;game.enemy.hp-=dmg;log("攻击造成 "+dmg+" 伤害");if(game.enemy.hp<=0)killEnemy();else enemyBack();render()}window.attackEnemy=attackEnemy;
function enemyBack(){let dmg=Math.max(1,Math.floor(game.enemy.atk-def()*0.55+Math.random()*game.enemy.atk*0.2));game.hp-=dmg;log(game.enemy.name+"反击，造成 "+dmg+" 伤害","bad");if(game.hp<=0){const loss=Math.floor(game.gold*0.06);game.gold-=loss;game.hp=Math.floor(maxHp()*0.65);log("你被打倒，损失 "+loss+" 金币，原地疗伤复活。","bad");newEnemy()}}
function killEnemy(){game.kills++;game.gold+=game.enemy.gold;game.xp+=game.enemy.xp;const h=1+Math.floor(Math.random()*3)+Math.floor(game.realm/2);game.herb+=h;log("击杀 "+game.enemy.name+"，金币+"+game.enemy.gold+" 经验+"+game.enemy.xp+" 药草+"+h,"ok");maybeDrop();while(game.xp>=expNeed()){game.xp-=expNeed();game.level++;game.baseHp+=12+game.realm*3;game.baseAtk+=2+game.realm;game.baseDef+=1;game.hp=maxHp();log("升级到 "+game.level,"rare")}newEnemy()}
function maybeDrop(){if(Math.random()<Math.min(0.28,0.08+game.level*0.001+game.realm*0.012)){const p=Math.floor(game.level*3+game.realm*18+8+Math.random()*20);if(p>game.equip){game.equip=p;game.baseAtk+=Math.floor(p*0.5);game.baseDef+=Math.floor(p*0.25);log("获得更强装备，装备战力 "+p,"rare")}}const arr=Object.keys(manuals).filter(n=>!game.manual[n].unlocked&&manuals[n].price>0&&manuals[n].rank<=Math.max(1,Math.floor(game.level/4)+1));if(arr.length&&Math.random()<0.035){const n=arr[Math.floor(Math.random()*arr.length)];game.manual[n].unlocked=true;log("发现功法残卷《"+n+"》","rare")}}
function addManualXp(n,v,silent){const s=game.manual[n];if(!s||!s.unlocked)return;s.xp+=v;let up=false;while(s.xp>=manualNeed(n)){s.xp-=manualNeed(n);s.level++;up=true}if(up&&!silent)log("《"+n+"》修炼到 "+s.level+" 重","rare")}
function cultivateTick(){const v=4+game.realm*1.5+Math.floor(game.level/6);addManualXp(game.active.body,v,true);addManualXp(game.active.inner,v,true);addManualXp(game.active.martial,v,true);render()}
function manualCultivate(){const v=35+game.level+game.realm*10;addManualXp(game.active.body,v);addManualXp(game.active.inner,v);addManualXp(game.active.martial,v);log("三系功法经验各 +"+v,"ok");render()}window.manualCultivate=manualCultivate;
function setManual(type,name){if(game.manual[name]&&game.manual[name].unlocked&&manuals[name].type===type){game.active[type]=name;log("开始主修《"+name+"》","ok")}render()}window.setManual=setManual;
function buyManual(n){const m=manuals[n];if(game.manual[n].unlocked)return;if(game.gold<m.price){log("金币不足","bad");return}game.gold-=m.price;game.manual[n].unlocked=true;log("购买《"+n+"》","rare");render()}window.buyManual=buyManual;
function fuseManual(t){const f=fusions.find(x=>x.target===t);if(!f||game.manual[t].unlocked)return;const miss=f.req.filter(r=>!game.manual[r[0]].unlocked||game.manual[r[0]].level<r[1]);if(miss.length){log("融合条件不足："+miss.map(r=>"《"+r[0]+"》"+r[1]+"重").join("、"),"bad");return}if(game.gold<f.gold||game.herb<f.herb){log("材料不足，需要金币"+f.gold+"、药草"+f.herb,"bad");return}game.gold-=f.gold;game.herb-=f.herb;game.manual[t].unlocked=true;game.manual[t].level=1;game.manual[t].xp=0;game.active[manuals[t].type]=t;log("融合成功！获得《"+t+"》","rare");render()}window.fuseManual=fuseManual;
function alchemyTick(){const r=recipes[game.alchemy.recipe];if(game.herb<r.herb||game.gold<r.gold)return;game.alchemy.progress+=1+game.alchemy.level*0.08;if(game.alchemy.progress>=r.time){game.alchemy.progress-=r.time;game.herb-=r.herb;game.gold-=r.gold;game.pill[game.alchemy.recipe]++;game.alchemy.xp+=18+r.time;log("炼成 "+r.name,"dan");while(game.alchemy.xp>=90+game.alchemy.level*game.alchemy.level*28){game.alchemy.xp-=90+game.alchemy.level*game.alchemy.level*28;game.alchemy.level++;log("炼丹术提升到 "+game.alchemy.level+" 级","dan")}}render()}
function setRecipe(k){game.alchemy.recipe=k;game.alchemy.progress=0;render()}window.setRecipe=setRecipe;
function useHealPill(){if(game.pill.heal<1){log("没有回春丹","bad");return}game.pill.heal--;game.hp=Math.min(maxHp(),game.hp+Math.floor(maxHp()*0.55));render()}window.useHealPill=useHealPill;
function useCultPill(type){if(game.pill[type]<1){log("没有对应丹药","bad");return}game.pill[type]--;addManualXp(game.active[type],180+game.alchemy.level*25+game.realm*30);render()}window.useCultPill=useCultPill;
function breakRealm(){if(game.realm>=realms.length-1){log("你已经是最高境界。","rare");return}if(game.level<nextRealmLevel()){log("等级不足，需要 "+nextRealmLevel()+" 级才能突破到 "+realms[game.realm+1],"bad");return}const cost=nextRealmCost();if(game.gold<cost){log("金币不足，突破需要 "+cost,"bad");return}game.gold-=cost;let chance=0.55+game.level*0.005;if(game.pill.break>0){game.pill.break--;chance+=0.18}if(Math.random()<chance){game.realm++;game.baseAtk+=15+game.realm*3;game.baseDef+=8+game.realm*2;game.baseHp+=120+game.realm*30;game.hp=maxHp();log("突破成功，到达 "+realms[game.realm],"rare")}else log("突破失败，损失金币。","bad");render()}window.breakRealm=breakRealm;
function toggleAuto(){game.auto=!game.auto;startCombat();render()}window.toggleAuto=toggleAuto;
let combatTimer=null;function startCombat(){clearInterval(combatTimer);if(game.auto)combatTimer=setInterval(attackEnemy,Math.max(360,1000-game.speed*50))}
function render(){initManuals();if(!game.enemy)newEnemy();if(game.hp>maxHp())game.hp=maxHp();const realmName=realms[game.realm]||"未知";$("realmText").textContent=realmName;$("realmStat").textContent=realmName;$("nextRealmText").textContent=game.realm>=realms.length-1?"已满":realms[game.realm+1]+" / "+nextRealmLevel()+"级";$("breakTip").textContent=game.realm>=realms.length-1?"你已经到达最高境界。":"下一境界："+realms[game.realm+1]+"，需要等级 "+nextRealmLevel()+"，金币 "+nextRealmCost()+"。破境丹可提高成功率。";$("levelText").textContent=game.level;$("goldText").textContent=Math.floor(game.gold);$("herbText").textContent=Math.floor(game.herb);$("atkText").textContent=Math.floor(atk());$("defText").textContent=Math.floor(def());$("hpText").textContent=Math.floor(game.hp)+"/"+Math.floor(maxHp());$("powerText").textContent=Math.floor(game.level*12+atk()*6+def()*5+maxHp()+game.equip*10);$("alchemyLevelText").textContent=game.alchemy.level;$("hpBar").style.width=pct(game.hp,maxHp());$("xpBar").style.width=pct(game.xp,expNeed());$("enemyName").textContent=game.enemy.name+" Lv."+game.enemy.level;$("enemyInfo").textContent="生命 "+Math.max(0,Math.floor(game.enemy.hp))+"/"+game.enemy.maxHp+" ｜ 攻击 "+game.enemy.atk;$("enemyBar").style.width=pct(game.enemy.hp,game.enemy.maxHp);$("killText").textContent=game.kills;$("dropText").textContent=Math.round(Math.min(0.28,0.08+game.level*0.001+game.realm*0.012)*100)+"%";$("equipText").textContent=game.equip;$("autoBtn").textContent="打怪挂机："+(game.auto?"开":"关");["body","inner","martial"].forEach(type=>{const sel=$(type+"Select");sel.innerHTML=Object.keys(manuals).filter(n=>manuals[n].type===type&&game.manual[n].unlocked).map(n=>"<option value='"+n+"' "+(game.active[type]===n?"selected":"")+">"+n+" "+game.manual[n].level+"重</option>").join("");const n=game.active[type],s=game.manual[n];$(type+"Bar").style.width=pct(s.xp,manualNeed(n));$(type+"Info").textContent="《"+n+"》"+s.level+"重 "+Math.floor(s.xp)+"/"+manualNeed(n)});$("recipeSelect").innerHTML=Object.keys(recipes).map(k=>"<option value='"+k+"' "+(game.alchemy.recipe===k?"selected":"")+">"+recipes[k].name+"</option>").join("");const rr=recipes[game.alchemy.recipe];$("alchemyBar").style.width=pct(game.alchemy.progress,rr.time);$("alchemyInfo").textContent=rr.name+"：消耗药草"+rr.herb+"、金币"+rr.gold+"，"+rr.desc;$("pillHeal").textContent=game.pill.heal;$("pillBody").textContent=game.pill.body;$("pillInner").textContent=game.pill.inner;$("pillMartial").textContent=game.pill.martial;$("pillBreak").textContent=game.pill.break;$("shopBox").innerHTML=Object.keys(manuals).filter(n=>manuals[n].price>0&&!game.manual[n].unlocked).map(n=>"<div class='row'><strong>《"+n+"》</strong><small>类型："+manuals[n].type+" ｜ 价格："+manuals[n].price+"金币</small><button onclick=\"buyManual('"+n+"')\">购买</button></div>").join("")||"功法残卷已买完。";$("fusionBox").innerHTML=fusions.map(f=>"<div class='row'><strong>融合《"+f.target+"》</strong><small>需要："+f.req.map(r=>"《"+r[0]+"》"+r[1]+"重").join(" + ")+"</small><small>材料：金币"+f.gold+"、药草"+f.herb+"</small><button "+(game.manual[f.target].unlocked?"disabled":"")+" onclick=\"fuseManual('"+f.target+"')\">"+(game.manual[f.target].unlocked?"已获得":"融合")+"</button></div>").join("");$("manualBox").innerHTML=Object.keys(manuals).map(n=>{const s=game.manual[n],m=manuals[n];return "<div class='row'><strong class='"+(s.unlocked?"ok":"bad")+"'>《"+n+"》 "+(s.unlocked?s.level+"重":"未获得")+"</strong><small>类型："+m.type+" ｜ 品阶："+m.rank+" ｜ 加成：生命+"+m.hp+" 攻击+"+m.atk+" 防御+"+m.def+"</small></div>"}).join("")}
function saveLocal(){game.last=Date.now();localStorage.setItem(LOCAL_KEY,JSON.stringify(game))}
async function saveServer(){try{const res=await fetch("/api/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({game})});if(!res.ok)throw new Error("server save failed");status("自动保存：本地和服务器都已保存。上次保存："+now());return true}catch(e){status("自动保存：浏览器本地已保存；服务器存档接口暂未连接。上次保存："+now());return false}}
async function saveGame(show){saveLocal();await saveServer();if(show)log("保存成功","ok")}window.saveGame=saveGame;
function loadLocal(){const raw=localStorage.getItem(LOCAL_KEY);if(!raw)return false;try{const old=JSON.parse(raw);game=Object.assign(game,old);game.pill=Object.assign({heal:0,body:0,inner:0,martial:0,break:0},game.pill||{});game.alchemy=Object.assign({recipe:"heal",progress:0,level:1,xp:0},game.alchemy||{});game.active=Object.assign({body:"铁布衫",inner:"养气诀",martial:"基础拳法"},game.active||{});return true}catch(e){return false}}
async function loadServer(){try{const res=await fetch("/api/load",{cache:"no-store"});if(!res.ok)throw new Error("server load failed");const data=await res.json();if(data&&data.ok&&data.game){if(!game.last||!data.game.last||data.game.last>=game.last){game=Object.assign(game,data.game);status("已读取服务器存档。自动保存：本地+服务器，每 5 秒一次。");log("读取服务器存档成功","ok");render();saveLocal();return true}}status("已读取浏览器本地存档。服务器存档较旧或为空。自动保存已开启。");return false}catch(e){status("已读取浏览器本地存档。服务器存档接口暂未连接，先用本地保存。");return false}}
function resetGame(){if(confirm("确定重开？会清空当前浏览器进度，下一次自动保存也会覆盖服务器存档。")){localStorage.removeItem(LOCAL_KEY);location.reload()}}window.resetGame=resetGame;
initManuals();const hasLocal=loadLocal();initManuals();if(!game.enemy)newEnemy();render();status(hasLocal?"已读取浏览器本地存档，正在尝试读取服务器存档……":"新存档已创建，正在尝试连接服务器存档……");loadServer();startCombat();setInterval(cultivateTick,1000);setInterval(alchemyTick,1000);setInterval(()=>saveGame(false),5000);window.addEventListener("beforeunload",()=>{saveLocal()});
})();
</script>
</body>
</html>
