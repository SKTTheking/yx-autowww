<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>文字挂机修仙</title><style>body{margin:0;background:#0b1020;color:#ddd;font-family:Arial,'Microsoft YaHei'}#app{max-width:1050px;margin:auto;padding:16px}h1{color:#facc15}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}.c{background:#172033;border:1px solid #334155;border-radius:12px;padding:12px}.s{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.b{background:#0f172a;border:1px solid #334155;border-radius:9px;padding:8px}.b strong{display:block;color:white}.bar{height:12px;background:#020617;border-radius:20px;overflow:hidden;border:1px solid #334155}.bar i{display:block;height:100%;background:#22c55e;width:0}.blue i{background:#3b82f6}.red i{background:#ef4444}.gold i{background:#facc15}.dan i{background:#14b8a6}button,select{border:0;border-radius:9px;padding:8px;margin:3px;background:#facc15;font-weight:700;cursor:pointer}.ok{color:#86efac}.no{color:#fca5a5}.rare{color:#c4b5fd}.log{height:260px;overflow:auto;background:#020617;border-radius:9px;padding:8px}small{color:#94a3b8}.row{background:#0f172a;border:1px solid #334155;border-radius:9px;padding:8px;margin:6px 0}@media(max-width:800px){.g,.s{grid-template-columns:1fr 1fr}}</style></head><body><div id='app'><h1>文字挂机修仙：功法融合版</h1><p>打怪、炼体、内功、武学、炼丹同时挂机。功法可以从低级一步步融合成高级。</p><div><button onclick='save(1)'>保存</button><button onclick='resetGame()'>重开</button><button onclick='toggle()' id='autoBtn'>打怪挂机：开</button></div><div class='g'><div class='c'><h2>角色 <span id='realm'></span></h2><div class='s'><div class='b'><strong id='lv'></strong><small>等级</small></div><div class='b'><strong id='gold'></strong><small>金币</small></div><div class='b'><strong id='herb'></strong><small>药草</small></div><div class='b'><strong id='pow'></strong><small>战力</small></div><div class='b'><strong id='atk'></strong><small>攻击</small></div><div class='b'><strong id='def'></strong><small>防御</small></div><div class='b'><strong id='hp'></strong><small>生命</small></div><div class='b'><strong id='alv'></strong><small>炼丹</small></div></div><p>生命</p><div class='bar'><i id='hpbar'></i></div><p>经验</p><div class='bar blue'><i id='xpbar'></i></div><button onclick='hit()'>手动攻击</button><button onclick='useHeal()'>使用回春丹</button><button onclick='breakRealm()'>突破境界</button></div><div class='c'><h2>敌人</h2><h3 id='mn'></h3><p id='mt'></p><div class='bar red'><i id='mbar'></i></div><p>击杀：<b id='kills'></b> ｜ 爆装率：<b id='drop'></b> ｜ 装备战力：<b id='eqp'></b></p></div><div class='c'><h2>三系功法挂机</h2><div class='s'><div class='b'>炼体<select id='body' onchange='act.body=this.value;ui()'></select><div class='bar gold'><i id='bodybar'></i></div><small id='bodytxt'></small></div><div class='b'>内功<select id='inner' onchange='act.inner=this.value;ui()'></select><div class='bar gold'><i id='innerbar'></i></div><small id='innertxt'></small></div><div class='b'>武学<select id='martial' onchange='act.martial=this.value;ui()'></select><div class='bar gold'><i id='martialbar'></i></div><small id='martialtxt'></small></div><div class='b'><button onclick='cultNow()'>手动参悟</button><button onclick='useBody()'>炼体丹</button><button onclick='useInner()'>聚气丹</button><button onclick='useMartial()'>悟道丹</button></div></div></div><div class='c'><h2>炼丹</h2><p>丹药：回春丹 <b id='ph'></b>，炼体丹 <b id='pb'></b>，聚气丹 <b id='pi'></b>，悟道丹 <b id='pm'></b>，破境丹 <b id='pr'></b></p><select id='recipe' onchange='al.r=this.value;al.p=0;ui()'></select><div class='bar dan'><i id='albar'></i></div><p id='alinfo'></p></div><div class='c'><h2>商店</h2><div id='shop'></div></div><div class='c'><h2>功法融合</h2><div id='fusion'></div></div><div class='c'><h2>功法库</h2><div id='manuals'></div></div><div class='c'><h2>日志</h2><div class='log' id='log'></div></div></div></div><script>const K='xianxia_github_v2',R=['凡人','炼气','筑基','金丹','元婴','化神','炼虚','合体','大乘','渡劫'],N=['野狼','山贼','黑熊','毒蛇','骷髅兵','赤焰虎','幽魂','石甲兽','魔修','妖王'];const M={'铁布衫':['body',1,10,0,1,0],'金钟罩':['body',1,14,0,2,180],'虎魔炼骨功':['body',2,28,1,3,620],'龙象镇狱体':['body',3,48,2,5,1300],'九转不灭身':['body',4,90,3,8,2600],'金刚不坏功':['body',3,70,2,8,0],'龙象玄黄体':['body',4,115,4,12,0],'九转金身诀':['body',6,220,8,22,0],'养气诀':['inner',1,6,1,0,0],'紫霞心法':['inner',1,8,1,1,180],'太玄经':['inner',2,16,3,2,650],'北冥真气诀':['inner',3,26,5,3,1350],'混元无极功':['inner',4,46,7,5,2800],'紫霞真元功':['inner',3,45,6,5,0],'北冥太玄功':['inner',4,80,10,7,0],'混元太上经':['inner',6,150,20,14,0],'基础拳法':['martial',1,0,3,0,0],'追风剑法':['martial',1,0,4,0,180],'降龙掌':['martial',2,8,8,1,680],'太极剑经':['martial',3,16,11,3,1400],'万剑归宗':['martial',4,22,18,4,3000],'风雷拳剑诀':['martial',3,8,14,2,0],'龙虎太极经':['martial',4,25,20,5,0],'万法归一剑典':['martial',6,45,38,8,0]};const F=[['金刚不坏功',[['铁布衫',3],['金钟罩',3]],500,20],['龙象玄黄体',[['虎魔炼骨功',4],['龙象镇狱体',4]],1200,45],['九转金身诀',[['金刚不坏功',5],['龙象玄黄体',5],['九转不灭身',3]],5200,150],['紫霞真元功',[['养气诀',3],['紫霞心法',3]],500,20],['北冥太玄功',[['太玄经',4],['北冥真气诀',4]],1300,50],['混元太上经',[['紫霞真元功',5],['北冥太玄功',5],['混元无极功',3]],5600,160],['风雷拳剑诀',[['基础拳法',3],['追风剑法',3]],500,20],['龙虎太极经',[['降龙掌',4],['太极剑经',4]],1350,55],['万法归一剑典',[['风雷拳剑诀',5],['龙虎太极经',5],['万剑归宗',3]],6000,170]];const D={heal:['回春丹',5,8,18,'恢复生命'],body:['炼体丹',9,16,28,'炼体经验'],inner:['聚气丹',9,16,28,'内功经验'],martial:['悟道丹',10,18,30,'武学经验'],break:['破境丹',28,80,70,'突破加成']};let lv=1,xp=0,goldN=0,herbN=0,hpN=100,max=100,atkN=5,defN=1,realmN=0,killsN=0,auto=1,speed=0,eq=0,mon=null,man={},act={body:'铁布衫',inner:'养气诀',martial:'基础拳法'},pill={heal:0,body:0,inner:0,martial:0,break:0},al={r:'heal',p:0,lv:1,xp:0};function init(){for(let n in M)if(!man[n])man[n]={u:['铁布衫','养气诀','基础拳法'].includes(n),lv:1,xp:0}}function saveMsg(x,c=''){let p=document.createElement('p');p.className=c;p.textContent='['+new Date().toLocaleTimeString()+'] '+x;log.prepend(p);while(log.children.length>80)log.lastChild.remove()}function need(){return 45+lv*lv*12|0}function mNeed(n){return 60*M[n][1]+man[n].lv*man[n].lv*26*M[n][1]|0}function bonus(){let h=0,a=0,d=0;for(let n in man)if(man[n].u){let m=M[n],f=man[n].lv*m[1];h+=m[2]*f;a+=m[3]*f;d+=m[4]*f}return[h|0,a|0,d|0]}function H(){return max+bonus()[0]}function A(){return atkN+bonus()[1]}function DF(){return defN+bonus()[2]}function pct(a,b){return Math.max(0,Math.min(100,a/b*100))+'%'}function newMon(){let l=Math.max(1,lv+(Math.random()*3|0)-1),t=Math.min(N.length-1,(lv-1)/5|0),m=24+l*18+realmN*35|0;mon={n:N[t],lv:l,hp:m,max:m,a:3+l*2.2+realmN*4|0,g:8+l*4|0,x:12+l*8|0}}function hit(){if(!mon)newMon();let d=A()+lv*2+realmN*7+Math.random()*A()*.5|0;if(Math.random()<.08)d*=2;mon.hp-=d;saveMsg('攻击造成 '+d+' 伤害');if(mon.hp<=0)kill();else{let r=Math.max(1,mon.a-DF()*.55|0);hpN-=r;saveMsg(mon.n+'反击 '+r+' 伤害','bad');if(hpN<=0){let loss=goldN*.06|0;goldN-=loss;hpN=H()*.65|0;saveMsg('你被打倒，损失 '+loss+' 金币','bad');newMon()}}ui()}function kill(){killsN++;goldN+=mon.g;xp+=mon.x;let h=1+(Math.random()*3|0)+(realmN/2|0);herbN+=h;saveMsg('击杀 '+mon.n+'，金币+'+mon.g+' 经验+'+mon.x+' 药草+'+h,'ok');drop();while(xp>=need()){xp-=need();lv++;max+=12+realmN*3;atkN+=2+realmN;defN++;hpN=H();saveMsg('升级到 '+lv,'rare')}newMon()}function drop(){if(Math.random()<Math.min(.28,.08+lv*.001+realmN*.012)){let p=lv*3+realmN*18+8|0;if(p>eq){eq=p;atkN+=p*.5|0;defN+=p*.25|0;saveMsg('获得新装备，战力 '+p,'rare')}}let arr=Object.keys(M).filter(n=>!man[n].u&&M[n][5]&&M[n][1]<=Math.max(1,(lv/4|0)+1));if(arr.length&&Math.random()<.035){let n=arr[Math.random()*arr.length|0];man[n].u=1;saveMsg('发现功法《'+n+'》','rare')}}function addMx(n,v,s){let o=man[n];if(!o||!o.u)return;o.xp+=v;let up=0;while(o.xp>=mNeed(n)){o.xp-=mNeed(n);o.lv++;up=1}if(up&&!s)saveMsg('《'+n+'》修炼到 '+o.lv+' 重','rare')}function cult(){let v=4+realmN*1.5+(lv/6|0);addMx(act.body,v,1);addMx(act.inner,v,1);addMx(act.martial,v,1);ui()}function cultNow(){let v=35+lv+realmN*10;addMx(act.body,v);addMx(act.inner,v);addMx(act.martial,v);saveMsg('三系功法经验各 +'+v,'ok');ui()}function alchemy(){let d=D[al.r];if(herbN<d[1]||goldN<d[2])return;al.p+=1+al.lv*.08;if(al.p>=d[3]){al.p-=d[3];herbN-=d[1];goldN-=d[2];pill[al.r]++;al.xp+=18+d[3];saveMsg('炼成 '+d[0],'dan');while(al.xp>=90+al.lv*al.lv*28){al.xp-=90+al.lv*al.lv*28;al.lv++;saveMsg('炼丹升到 '+al.lv,'dan')}}ui()}function useHeal(){if(pill.heal<1)return saveMsg('没有回春丹','bad');pill.heal--;hpN=Math.min(H(),hpN+H()*.55|0);ui()}function useBody(){usePill('body')}function useInner(){usePill('inner')}function useMartial(){usePill('martial')}function usePill(t){if(pill[t]<1)return saveMsg('没有丹药','bad');pill[t]--;addMx(act[t],180+al.lv*25+realmN*30);ui()}function buy(n){let c=M[n][5];if(goldN<c)return saveMsg('金币不足','bad');goldN-=c;man[n].u=1;saveMsg('购买《'+n+'》','rare');ui()}function fuse(t){let f=F.find(x=>x[0]==t),miss=f[1].filter(a=>!man[a[0]].u||man[a[0]].lv<a[1]);if(miss.length)return saveMsg('条件不足','bad');if(goldN<f[2]||herbN<f[3])return saveMsg('材料不足','bad');goldN-=f[2];herbN-=f[3];man[t].u=1;act[M[t][0]]=t;saveMsg('融合成功：《'+t+'》','rare');ui()}function breakRealm(){if(lv<(realmN+1)*10)return saveMsg('等级不足','bad');let c=500+realmN*700;if(goldN<c)return saveMsg('金币不足','bad');goldN-=c;let chance=.55+lv*.005+(pill.break>0?.18:0);if(pill.break>0)pill.break--;if(Math.random()<chance){realmN++;atkN+=15;defN+=8;max+=120;hpN=H();saveMsg('突破到 '+R[realmN],'rare')}else saveMsg('突破失败','bad');ui()}function toggle(){auto=!auto;start();ui()}function start(){clearInterval(loop);if(auto)loop=setInterval(hit,Math.max(350,1000-speed*50))}function ui(){init();if(!mon)newMon();if(hpN>H())hpN=H();realm.textContent=R[realmN];lv.textContent=window.lv;gold.textContent=goldN|0;herb.textContent=herbN|0;pow.textContent=(lv*12+A()*6+DF()*5+H()+eq*10)|0;atk.textContent=A()|0;def.textContent=DF()|0;hp.textContent=(hpN|0)+'/'+(H()|0);alv.textContent=al.lv;hpbar.style.width=pct(hpN,H());xpbar.style.width=pct(xp,need());mn.textContent=mon.n+' Lv.'+mon.lv;mt.textContent='生命 '+Math.max(0,mon.hp|0)+'/'+mon.max+' 攻击 '+mon.a;mbar.style.width=pct(mon.hp,mon.max);kills.textContent=killsN;drop.textContent=Math.round(Math.min(.28,.08+lv*.001+realmN*.012)*100)+'%';eqp.textContent=eq;autoBtn.textContent='打怪挂机：'+(auto?'开':'关');['body','inner','martial'].forEach(t=>{let e=document.getElementById(t);e.innerHTML=Object.keys(M).filter(n=>M[n][0]==t&&man[n].u).map(n=>'<option '+(act[t]==n?'selected':'')+'>'+n+'</option>').join('');let n=act[t];document.getElementById(t+'bar').style.width=pct(man[n].xp,mNeed(n));document.getElementById(t+'txt').textContent='《'+n+'》'+man[n].lv+'重 '+(man[n].xp|0)+'/'+mNeed(n)});recipe.innerHTML=Object.keys(D).map(k=>'<option value='+k+' '+(al.r==k?'selected':'')+'>'+D[k][0]+'</option>').join('');albar.style.width=pct(al.p,D[al.r][3]);alinfo.textContent=D[al.r][0]+'：消耗药草'+D[al.r][1]+' 金币'+D[al.r][2]+'，产物：'+D[al.r][4];ph.textContent=pill.heal;pb.textContent=pill.body;pi.textContent=pill.inner;pm.textContent=pill.martial;pr.textContent=pill.break;shop.innerHTML=Object.keys(M).filter(n=>M[n][5]&&!man[n].u).map(n=>`<div class=row><b>《${n}》</b><small>价格 ${M[n][5]} 金币</small><button data-n='${n}' onclick='buy(this.dataset.n)'>购买</button></div>`).join('')||'功法已买完';fusion.innerHTML=F.map(f=>`<div class=row><b>融合《${f[0]}》</b><small>金币${f[2]} 药草${f[3]} ｜ ${f[1].map(a=>'《'+a[0]+'》'+a[1]+'重').join(' + ')}</small><button data-n='${f[0]}' onclick='fuse(this.dataset.n)' ${man[f[0]].u?'disabled':''}>融合</button></div>`).join('');manuals.innerHTML=Object.keys(M).map(n=>'<div class=row><b class='+(man[n].u?'ok':'no')+'>《'+n+'》 '+(man[n].u?man[n].lv+'重':'未获得')+'</b><small>类型 '+M[n][0]+' 品阶 '+M[n][1]+' 加成 生命+'+M[n][2]+' 攻击+'+M[n][3]+' 防御+'+M[n][4]+'</small></div>').join('')}function save(show){localStorage.setItem(K,JSON.stringify({lv,xp,goldN,herbN,hpN,max,atkN,defN,realmN,killsN,auto,speed,eq,mon,man,act,pill,al,time:Date.now()}));if(show)saveMsg('保存成功','ok')}function load(){let s=localStorage.getItem(K);if(s)try{let o=JSON.parse(s);Object.assign(window,o);saveMsg('读取存档成功','ok')}catch(e){}init()}function resetGame(){if(confirm('确定重开？')){localStorage.removeItem(K);location.reload()}}let loop=0;load();ui();start();setInterval(cult,1000);setInterval(alchemy,1000);setInterval(()=>save(0),10000);addEventListener('beforeunload',()=>save(0));</script></body></html>
